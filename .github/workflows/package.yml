name: Build package

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build distributable package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: bash scripts/build-package.sh

      - name: Upload zip package
        uses: actions/upload-artifact@v4
        with:
          name: kvas-1.0.1-zip
          path: dist/kvas-1.0.1.zip
          if-no-files-found: error

      - name: Upload tar.gz package
        uses: actions/upload-artifact@v4
        with:
          name: kvas-1.0.1-tar-gz
          path: dist/kvas-1.0.1.tar.gz
          if-no-files-found: error
