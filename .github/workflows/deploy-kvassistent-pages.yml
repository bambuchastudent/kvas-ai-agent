name: Deploy current KVASSISTENT site

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: kvassistent-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install publication dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-publication.txt

      - name: Read and recount current release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('release/version.json'))['current'])")"
          ONES="$(python -c "import json; print(json.load(open('release/version.json'))['ones_count'])")"
          COUNTED="$(python -c "import json; v=json.load(open('release/version.json'))['current']; print(sum(part == '1' for part in v.split('.')))" )"
          test "$ONES" = "21"
          test "$COUNTED" = "21"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_ONES=$ONES" >> "$GITHUB_ENV"
          echo "Deploying KVASSISTENT $ONES: v$VERSION"

      - name: Prepare, test, build and enhance current site
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:release
          npm run test:companion
          npm run test:localization
          npm run package
          npm run enhance:release
          test -f "dist/site/v${RELEASE_VERSION}/index.html"
          test -f "dist/site/feedback/index.html"
          grep -R "https://t.me/kvassistent_bot" \
            "dist/site/feedback/index.html" \
            "dist/site/v${RELEASE_VERSION}/index.html"
          grep -R "https://github.com/bambuchastudent/kvas-ai-agent" \
            "dist/site/feedback/index.html" \
            "dist/site/v${RELEASE_VERSION}/index.html"
          ! grep -R "formsubmit.co" "dist/site/feedback/index.html"

      - name: Verify all stable entry points in build
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            index.html \
            game/index.html \
            companion/index.html \
            feedback/index.html \
            telegram/index.html \
            "v${RELEASE_VERSION}/index.html"; do
            test -f "dist/site/$path"
          done

      - name: Publish gh-pages branch for Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kvassistent-site
          mkdir -p /tmp/kvassistent-site
          cp -a dist/site/. /tmp/kvassistent-site/

          git config user.name "KVASSISTENT Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan kvassistent-pages-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/kvassistent-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish KVASSISTENT ${RELEASE_ONES}: v${RELEASE_VERSION}"
          git push origin HEAD:gh-pages --force

      - name: Verify Cloudflare Pages and Telegram backend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://kvassistent.pages.dev"
          IMMUTABLE="${BASE}/v${RELEASE_VERSION}"
          BACKEND_STATUS="https://q49g8jkjoe.execute-api.eu-west-1.amazonaws.com/default/kvassistent/status"

          for attempt in $(seq 1 40); do
            ok=1
            curl --fail --location --silent --show-error \
              "${IMMUTABLE}/manifest.json" -o /tmp/manifest.json || ok=0
            grep -q "\"version\": \"${RELEASE_VERSION}\"" /tmp/manifest.json 2>/dev/null || ok=0
            grep -q "\"ones_count\": ${RELEASE_ONES}" /tmp/manifest.json 2>/dev/null || ok=0

            curl --fail --location --silent --show-error \
              "${BASE}/feedback/" -o /tmp/feedback.html || ok=0
            grep -q "https://t.me/kvassistent_bot" /tmp/feedback.html 2>/dev/null || ok=0

            curl --fail --location --silent --show-error \
              "$BACKEND_STATUS" -o /tmp/backend-status.json || ok=0
            jq -e \
              --arg version "v.${RELEASE_VERSION}" \
              --argjson release "$RELEASE_ONES" \
              '.ok == true and .ready == true and .release_number == $release and (.version == $version or .version == ($version | sub("^v\\."; "v")))' \
              /tmp/backend-status.json >/dev/null 2>&1 || ok=0

            for url in \
              "${BASE}/" \
              "${BASE}/game/" \
              "${BASE}/companion/" \
              "${BASE}/feedback/" \
              "${BASE}/telegram/" \
              "${IMMUTABLE}/" \
              "https://t.me/kvassistent_bot" \
              "https://github.com/bambuchastudent/kvas-ai-agent"; do
              curl --fail --location --silent --show-error --output /dev/null "$url" || ok=0
            done

            if [ "$ok" -eq 1 ]; then
              echo "KVASSISTENT ${RELEASE_ONES} is live at ${BASE}/"
              echo "Immutable: ${IMMUTABLE}/"
              echo "Telegram bot and backend version ${RELEASE_ONES} are reachable."
              exit 0
            fi

            echo "Waiting for Cloudflare Pages and backend ($attempt/40)..."
            sleep 10
          done

          echo "KVASSISTENT ${RELEASE_ONES} publication or linked services failed verification." >&2
          echo "Manifest:" >&2
          cat /tmp/manifest.json >&2 2>/dev/null || true
          echo "Backend status:" >&2
          cat /tmp/backend-status.json >&2 2>/dev/null || true
          exit 1
