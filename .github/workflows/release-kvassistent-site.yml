name: Release KVASSISTENT site

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - .github/release-now

permissions:
  contents: write

concurrency:
  group: kvassistent-site-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install publication dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-publication.txt

      - name: Install Telegram feedback source
        run: |
          python - <<'PY'
          from pathlib import Path

          bot_url = "https://t.me/kvassistent_bot"

          feedback_html = '''<!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#17130d">
            <meta name="description" content="Напишите КВАССИСТЕНТУ в Telegram о своём квасе, рецепте, идее или ошибке.">
            <title>Обратная связь · КВАССИСТЕНТ</title>
            <link rel="stylesheet" href="styles.css">
          </head>
          <body>
            <header>
              <a class="brand" href="../"><span>К</span><strong>КВАССИСТЕНТ</strong></a>
              <a class="quiet-link" href="../companion/">Живая партия →</a>
            </header>
            <main>
              <section class="hero">
                <p class="kicker">Обратная связь · Telegram</p>
                <h1>Расскажи нам<br><em>про свой напиток.</em></h1>
                <p class="lead">Рецепт, фотография, история удачной партии, предложение или ошибка — напиши боту <a href="https://t.me/kvassistent_bot" target="_blank" rel="noopener noreferrer">@kvassistent_bot</a>. Сообщение попадёт владельцу КВАССИСТЕНТА.</p>
              </section>

              <section class="layout">
                <article class="telegram-card">
                  <div class="form-heading"><span>01</span><div><h2>Открой Telegram</h2><p>Можно отправить текст, фотографию, видео или ссылку на рецепт.</p></div></div>
                  <p>Напиши своими словами: что готовил, какие были пропорции, сколько шло брожение и что получилось. Бот подтвердит получение и передаст сообщение.</p>
                  <a class="telegram-cta" href="https://t.me/kvassistent_bot" target="_blank" rel="noopener noreferrer"><strong>Написать КВАССИСТЕНТУ</strong><span>→</span></a>
                  <p class="privacy">Не отправляй пароли, платёжные данные и другую чувствительную информацию.</p>
                </article>

                <aside>
                  <p class="kicker">Прямая связь</p>
                  <h2>Один бот вместо формы и почты.</h2>
                  <p>Обратная связь теперь работает через серверлесс-бота в AWS Lambda. Никаких FormSubmit и потерянных писем.</p>
                  <nav aria-label="Контакты">
                    <a href="https://t.me/kvassistent_bot" target="_blank" rel="noopener noreferrer"><strong>Telegram</strong><span>@kvassistent_bot ↗</span></a>
                    <a href="https://github.com/bambuchastudent/kvas-ai-agent" target="_blank" rel="noopener noreferrer"><strong>GitHub</strong><span>Код проекта ↗</span></a>
                  </nav>
                </aside>
              </section>
            </main>
            <footer>КВАССИСТЕНТ · Твоя кухня, твоя история</footer>
          </body>
          </html>
          '''
          Path("feedback/index.html").write_text(feedback_html, encoding="utf-8")

          styles_path = Path("feedback/styles.css")
          styles = styles_path.read_text(encoding="utf-8")
          extra = '.telegram-card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#251f16,#1d1811);padding:clamp(22px,4.5vw,42px);box-shadow:0 25px 80px rgba(0,0,0,.18)}.telegram-card>p{color:var(--muted);font-size:17px;line-height:1.65}.telegram-cta{display:flex;width:100%;align-items:center;justify-content:space-between;margin-top:28px;border-radius:14px;padding:17px 20px;background:var(--gold);color:#17130d;text-decoration:none;font:850 14px var(--sans)}.telegram-cta:hover{filter:brightness(1.06);transform:translateY(-1px)}.telegram-cta span{font-size:22px}'
          if '.telegram-card{' not in styles:
              styles_path.write_text(styles + extra, encoding="utf-8")

          build_path = Path("scripts/build-release.py")
          build = build_path.read_text(encoding="utf-8")
          version_needle = 'def configure_localized_document_metadata(core, version: str, ones_count: int) -> None:\n    labels = {'
          if version_needle in build:
              build = build.replace(
                  version_needle,
                  'def configure_localized_document_metadata(core, version: str, ones_count: int) -> None:\n    core.VERSION = version\n    labels = {',
                  1,
              )
          telegram_patch = '    text = text.replace("https://github.com/bambuchastudent/kvas-ai-agent/issues/new", "https://t.me/kvassistent_bot")\n'
          write_needle = '    landing.write_text(text, encoding="utf-8")\n'
          if telegram_patch not in build and write_needle in build:
              build = build.replace(write_needle, telegram_patch + write_needle, 1)
          build_path.write_text(build, encoding="utf-8")
          PY

      - name: Create next ones release
        run: npm run next-release

      - name: Synchronize release sources
        run: npm run prepare:release

      - name: Write release notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path('release/version.json').read_text(encoding='utf-8'))
          version = meta['current']
          ones = meta['ones_count']
          Path(f'release/RELEASE-{version}.md').write_text(
              f'# КВАССИСТЕНТ {version}\n\n'
              f'**Версия {ones}, потому что в ней единиц вот столько: {ones}. Пересчитай: v{version}**\n\n'
              '## Изменения\n\n'
              '- Обратная связь переведена на Telegram-бота @kvassistent_bot.\n'
              '- Удалена зависимость пользовательской формы от FormSubmit.\n'
              '- Версии package, manifest, gallery и immutable URL синхронизированы.\n'
              '- Сборщик получает текущую версию динамически и больше не застревает на старом номере.\n',
              encoding='utf-8',
          )
          print(f'Releasing KVASSISTENT {ones}: v{version}')
          PY

      - name: Test and build site
        run: |
          set -euo pipefail
          npm run test:companion
          npm run test:localization
          npm run package
          grep -R "https://t.me/kvassistent_bot" dist/site/feedback/index.html dist/site/v*/index.html
          ! grep -R "formsubmit.co" dist/site/feedback/index.html

      - name: Commit release sources
        run: |
          set -euo pipefail
          git config user.name "KVASSISTENT Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            feedback/index.html feedback/styles.css \
            release/version.json release/version.md release/RELEASE-*.md \
            publication/manifest.json gallery/drinks.json package.json \
            scripts/build-release.py scripts/enhance-release.py \
            companion/game/index.html companion/game/i18n.js companion/sw.js \
            share/kvassistent-*-comic.svg
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          ONES="$(python -c "import json; print(json.load(open('release/version.json'))['ones_count'])")"
          VERSION="$(python -c "import json; print(json.load(open('release/version.json'))['current'])")"
          git commit -m "Release KVASSISTENT ${ONES}: v${VERSION} with Telegram feedback"
          git push origin HEAD:develop
