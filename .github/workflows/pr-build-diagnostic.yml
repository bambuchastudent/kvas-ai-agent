name: PR build diagnostic

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core fonts-noto-cjk fonts-noto-mono poppler-utils
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -r requirements-publication.txt
      - name: Run build with captured output
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== companion tests ==='
            node scripts/test-companion.mjs
            echo '=== publication build ==='
            python scripts/build-release.py
          } 2>&1 | tee /tmp/kvassistent-build.log
      - name: Comment diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          {
            echo "### Temporary build diagnostic: ${BUILD_OUTCOME}"
            echo
            echo '```text'
            tail -n 120 /tmp/kvassistent-build.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          test "$BUILD_OUTCOME" = success
