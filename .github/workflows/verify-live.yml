name: Verify live KVASSISTENT release and website

on:
  workflow_run:
    workflows:
      - Publish KVASSISTENT release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    name: Verify release assets and live language pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Read release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release/version.json"))["current"])')"
          ONES_COUNT="$(python -c 'import json; print(json.load(open("release/version.json"))["ones_count"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ONES_COUNT=$ONES_COUNT" >> "$GITHUB_ENV"
          echo "SITE=https://raw.githack.com/bambuchastudent/kvas-ai-agent/gh-pages/v$VERSION" >> "$GITHUB_ENV"
          echo "PAGES_SITE=https://kvassistent.pages.dev/v$VERSION" >> "$GITHUB_ENV"

      - name: Verify GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-verification/release-pdfs
          gh release view "$TAG" --json tagName,name,assets > live-verification/release.json
          gh release download "$TAG" --pattern '*.pdf' --dir live-verification/release-pdfs

          expected_languages=(ru en es de zh-CN)
          expected_types=(summary instructions)
          for lang in "${expected_languages[@]}"; do
            for type in "${expected_types[@]}"; do
              test -s "live-verification/release-pdfs/kvas-${type}-${lang}-${VERSION}.pdf"
            done
          done
          test "$(find live-verification/release-pdfs -maxdepth 1 -name '*.pdf' | wc -l)" -eq 10

          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in \
            manifest.json \
            "kvas-${VERSION}-publication.zip" \
            "kvas-${VERSION}-publication.tar.gz" \
            "kvassistent-${VERSION}-website.zip" \
            "kvassistent-${VERSION}-website.tar.gz"; do
            grep -Fxq "$asset" <<<"$assets"
          done

      - name: Verify guaranteed web mirror and PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-verification/site
          curl --fail --location --retry 8 --retry-delay 5 "$SITE/manifest.json" \
            --output live-verification/site/manifest.json
          grep -q "\"version\": \"${VERSION}\"" live-verification/site/manifest.json
          grep -q "\"ones_count\": ${ONES_COUNT}" live-verification/site/manifest.json

          expected_languages=(ru en es de zh-CN)
          expected_types=(summary instructions)
          for lang in "${expected_languages[@]}"; do
            for type in "${expected_types[@]}"; do
              curl --fail --location --retry 8 --retry-delay 5 \
                "$SITE/${lang}/${type}/index.html" \
                --output "live-verification/site/${lang}-${type}.html"
              grep -q "Version ${VERSION}" "live-verification/site/${lang}-${type}.html"

              curl --fail --location --retry 8 --retry-delay 5 \
                "$SITE/pdfs/kvas-${type}-${lang}-${VERSION}.pdf" \
                --output "live-verification/site/kvas-${type}-${lang}-${VERSION}.pdf"
              test "$(head -c 4 "live-verification/site/kvas-${type}-${lang}-${VERSION}.pdf")" = '%PDF'
            done
          done

      - name: Verify Cloudflare Pages homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 5 "$PAGES_SITE/manifest.json" \
            --output live-verification/site/cloudflare-pages-manifest.json
          grep -q "\"version\": \"${VERSION}\"" live-verification/site/cloudflare-pages-manifest.json
          grep -q "\"ones_count\": ${ONES_COUNT}" live-verification/site/cloudflare-pages-manifest.json

          curl --fail --location --retry 8 --retry-delay 5 "$PAGES_SITE/index.html" \
            --output live-verification/site/cloudflare-homepage.html
          grep -q '<h1>ТВОЙ ЛИЧНЫЙ КВАССИСТЕНТ</h1>' live-verification/site/cloudflare-homepage.html
          grep -q 'ИИ управляет приготовлением кваса «Жижа». Ты делаешь его своими руками.' live-verification/site/cloudflare-homepage.html
          grep -q '<strong>ИИ управляет</strong>' live-verification/site/cloudflare-homepage.html
          grep -q '<strong>Ты готовишь</strong>' live-verification/site/cloudflare-homepage.html
          grep -q 'твой домашний квас «Жижа»' live-verification/site/cloudflare-homepage.html
          grep -q 'Лучшие инструкции для людей' live-verification/site/cloudflare-homepage.html
          grep -q 'id="for-people"' live-verification/site/cloudflare-homepage.html
          grep -q 'id="for-ai-agents"' live-verification/site/cloudflare-homepage.html
          grep -q 'Для ИИ-агентов' live-verification/site/cloudflare-homepage.html
          grep -q 'Open human guide' live-verification/site/cloudflare-homepage.html
          grep -q 'Abrir guía para personas' live-verification/site/cloudflare-homepage.html
          grep -q 'Anleitung für Menschen' live-verification/site/cloudflare-homepage.html
          grep -q '打开用户指南' live-verification/site/cloudflare-homepage.html
          grep -q 'AI agent instructions' live-verification/site/cloudflare-homepage.html
          grep -q 'Instrucciones para agente de IA' live-verification/site/cloudflare-homepage.html
          grep -q 'Anleitung für KI-Agenten' live-verification/site/cloudflare-homepage.html
          grep -q 'AI 智能体说明' live-verification/site/cloudflare-homepage.html
          grep -q "единиц: ${ONES_COUNT}" live-verification/site/cloudflare-homepage.html

      - name: Write verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "# КВАССИСТЕНТ ${VERSION} live verification"
            echo
            echo "- Единиц в версии: ${ONES_COUNT}"
            echo '- Expected PDFs: 10'
            echo '- Expected web pages: 10'
            echo '- Languages: ru, en, es, de, zh-CN'
            echo "- Release: https://github.com/bambuchastudent/kvas-ai-agent/releases/tag/v${VERSION}"
            echo "- Guaranteed web mirror: https://raw.githack.com/bambuchastudent/kvas-ai-agent/gh-pages/v${VERSION}/index.html"
            echo "- Cloudflare Pages: https://kvassistent.pages.dev/v${VERSION}/"
          } > live-verification/README.md

      - name: Upload live verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvassistent-live-verification
          path: live-verification/
          if-no-files-found: warn
          retention-days: 14
