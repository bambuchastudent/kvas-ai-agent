name: Deploy KVASSISTENT website

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-kvassistent-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release/version.json"))["current"])')"
          ONES_COUNT="$(python -c 'import json; print(json.load(open("release/version.json"))["ones_count"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ONES_COUNT=$ONES_COUNT" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-mono \
            poppler-utils
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -r requirements-publication.txt
          fc-cache -f >/dev/null

      - name: Build versioned website
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-companion.mjs
          python scripts/build-release.py

      - name: Verify version 15 landing and globe game
        shell: bash
        run: |
          set -euo pipefail
          landing="dist/site/v${VERSION}/index.html"
          game="dist/site/v${VERSION}/companion/game/index.html"
          test -s "$landing"
          test -s "$game"
          grep -Fq "Версия ${ONES_COUNT}, потому что в ней единиц вот столько: ${ONES_COUNT}" "$landing"
          grep -Fq 'id="site-topbar"' "$landing"
          grep -Fq 'id="header-language-select"' "$landing"
          grep -Fq 'id="globe-game"' "$landing"
          grep -Fq 'id="all-links"' "$landing"
          grep -Fq "ВЕРСИЯ ${ONES_COUNT}" "$game"
          test "$(grep -o 'class="site"' "$game" | wc -l)" -eq 6

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kvassistent-site
          mkdir -p /tmp/kvassistent-site
          cp -a dist/site/. /tmp/kvassistent-site/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages-build
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kvassistent-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish КВАССИСТЕНТ ${VERSION} website"
          git push origin HEAD:gh-pages --force
