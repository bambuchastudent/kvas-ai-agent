name: Deploy KVASSISTENT website

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-kvassistent-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish latest website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release/version.json"))["current"])')"
          ONES_COUNT="$(python -c 'import json; print(json.load(open("release/version.json"))["ones_count"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ONES_COUNT=$ONES_COUNT" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-mono \
            poppler-utils
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -r requirements-publication.txt
          fc-cache -f >/dev/null

      - name: Test rules and localization
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-release.py scripts/next-ones-version.py
          node scripts/test-companion.mjs
          node scripts/test-localization.mjs

      - name: Build immutable release and latest aliases
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-release.py

      - name: Verify release and short URLs
        shell: bash
        run: |
          set -euo pipefail
          landing="dist/site/v${VERSION}/index.html"
          game="dist/site/v${VERSION}/companion/game/index.html"
          test -s "$landing"
          test -s "$game"
          grep -Fq "Версия ${ONES_COUNT}, потому что в ней единиц вот столько: ${ONES_COUNT}. Пересчитай:" "$landing"
          grep -Fq "v${VERSION}" "$landing"
          grep -Fq 'href="/game/"' "$landing"
          grep -Fq 'href="/companion/"' "$landing"
          grep -Fq 'id="header-language-select"' "$landing"
          grep -Fq 'id="globe-game"' "$landing"
          grep -Fq 'id="all-links"' "$landing"
          grep -Fq 'id="localization"' "$landing"
          grep -Fq "VERSION ${ONES_COUNT}" "$game"
          grep -Fq 'id="game-language"' "$game"
          test "$(grep -o 'class="site"' "$game" | wc -l)" -eq 6

          test -s dist/site/index.html
          test -s dist/site/game/index.html
          test -s dist/site/companion/index.html
          test -s dist/site/feedback/index.html
          test -s dist/site/ru/summary/index.html
          test -s dist/site/en/summary/index.html
          test -s dist/site/latest-version.json

          python - <<'PY'
          from pathlib import Path
          text = Path('dist/site/companion/index.html').read_text(encoding='utf-8')
          assert not any(('А' <= ch <= 'я') or ch in 'Ёё' for ch in text), 'Russian leaked into universal companion fallback'
          PY

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kvassistent-site
          mkdir -p /tmp/kvassistent-site
          cp -a dist/site/. /tmp/kvassistent-site/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages-build
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kvassistent-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish KVASSISTENT ${VERSION} website"
          git push origin HEAD:gh-pages --force
