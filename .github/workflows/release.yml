name: Publish release 1.0.5

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/release.yml"
      - "release/RELEASE-1.0.5.md"
      - "release/version.md"
      - "package.json"
      - "scripts/build-package.sh"
      - "README.zh-CN.md"
      - "agent-instructions/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-1.0.5
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v1.0.5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency and translations
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "1.0.5"' package.json
          grep -q 'VERSION="1.0.5"' scripts/build-package.sh
          grep -q 'Current release: 1.0.5' release/version.md
          grep -q '# Квас 1.0.5' release/RELEASE-1.0.5.md
          grep -q '"protocol_version": "1.0.5"' agent-instructions/state-example.json
          test -s README.zh-CN.md
          test -s agent-instructions/kvas-agent.zh-CN.md
          test -s agent-instructions/state-model.zh-CN.md
          grep -q '当前版本：1.0.5' README.zh-CN.md
          grep -q '模型版本：\*\*1.0.5\*\*' agent-instructions/state-model.zh-CN.md

      - name: Build packages
        run: bash scripts/build-package.sh

      - name: Verify Chinese files are packaged
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/kvas-1.0.5.zip | grep -q 'kvas-1.0.5/README.zh-CN.md'
          unzip -l dist/kvas-1.0.5.zip | grep -q 'kvas-1.0.5/agent-instructions/kvas-agent.zh-CN.md'
          unzip -l dist/kvas-1.0.5.zip | grep -q 'kvas-1.0.5/agent-instructions/state-model.zh-CN.md'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.5
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Квас 1.0.5 — stateful AI agent" \
              --notes-file release/RELEASE-1.0.5.md
            gh release upload "$TAG" \
              dist/kvas-1.0.5.zip \
              dist/kvas-1.0.5.tar.gz \
              --clobber
          else
            gh release create "$TAG" \
              dist/kvas-1.0.5.zip \
              dist/kvas-1.0.5.tar.gz \
              --target "$GITHUB_SHA" \
              --title "Квас 1.0.5 — stateful AI agent" \
              --notes-file release/RELEASE-1.0.5.md
          fi
