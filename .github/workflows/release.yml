name: Publish KVASSISTENT release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-kvassistent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      ones_count: ${{ steps.release-meta.outputs.ones_count }}
      artifact_name: ${{ steps.release-meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read release metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          meta = json.loads(Path("release/version.json").read_text(encoding="utf-8"))
          version = str(meta["current"])
          ones = int(meta["ones_count"])
          if version.split(".") != ["1"] * ones:
              raise SystemExit(f"Version mismatch: expected {ones} ones, got {version}")
          if meta.get("display") != f"v{version}":
              raise SystemExit("Technical display must be lowercase v plus the full version")
          if meta.get("human_label") != f"Версия {ones}":
              raise SystemExit("Human label must be 'Версия N'")
          print(f"version={version}")
          print(f"ones_count={ones}")
          print(f"artifact_name=kvassistent-{version}-publication-build")
          PY
          VERSION="$(python -c 'import json; print(json.load(open("release/version.json"))["current"])')"
          ONES_COUNT="$(python -c 'import json; print(json.load(open("release/version.json"))["ones_count"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ONES_COUNT=$ONES_COUNT" >> "$GITHUB_ENV"
          echo "KVASSISTENT · Версия $ONES_COUNT · v$VERSION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-core fonts-noto-cjk fonts-noto-mono poppler-utils
          python -m pip install --quiet -r requirements-publication.txt
          fc-cache -f >/dev/null

      - name: Build once
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-release.py
          python -m compileall -q scripts
          python scripts/check-version-consistency.py
          npm run test:companion
          npm run test:localization
          npm run test:game
          python scripts/build-release.py 2>&1 | tee publication-build.log
          python scripts/enhance-release.py
          KVASSISTENT_GAME_ROOT="dist/site/v${VERSION}/companion/game" npm run test:game
          (cd dist/site && zip -qr "../kvassistent-${VERSION}-website.zip" .)
          tar -C dist/site -czf "dist/kvassistent-${VERSION}-website.tar.gz" .

      - name: Verify generated release
        shell: bash
        run: |
          set -euo pipefail
          immutable="dist/site/v${VERSION}"
          landing="$immutable/index.html"
          game="$immutable/companion/game"

          test "$(find dist/publication -maxdepth 1 -name '*.pdf' | wc -l)" -eq 12
          for pdf in dist/publication/*.pdf; do
            test -s "$pdf"
            pdfinfo "$pdf" | grep -q '^Pages:'
          done

          for path in \
            "dist/kvas-${VERSION}-publication.zip" \
            "dist/kvas-${VERSION}-publication.tar.gz" \
            "dist/kvassistent-${VERSION}-website.zip" \
            "dist/kvassistent-${VERSION}-website.tar.gz" \
            "$immutable/manifest.json" "$immutable/version.json" \
            "$landing" "$game/index.html" "$game/game.js" "$game/game-state.js" "$game/styles.css" \
            "$immutable/companion/index.html" "$immutable/feedback/index.html" \
            "$immutable/telegram/index.html" dist/site/latest-version.json; do
            test -s "$path"
          done

          grep -Fq "Версия ${ONES_COUNT}" "$landing"
          grep -Fq "v${VERSION}" "$landing"
          grep -Fq 'id="site-topbar"' "$landing"
          grep -Fq 'id="header-version-badge"' "$landing"
          grep -Fq 'id="header-language-select"' "$landing"
          grep -Fq 'https://t.me/kvassistent_bot' "$landing"

          grep -Fq 'id="globe"' "$game/index.html"
          grep -Fq 'tabindex="0"' "$game/index.html"
          grep -Fq 'globe.addEventListener("click"' "$game/game.js"
          grep -Fq 'nearestLaunchSite' "$game/game.js"
          grep -Fq 'class="gas-bubble b1"' "$game/game.js"
          grep -Fq 'class="paper-wing left"' "$game/game.js"
          grep -Fq '@keyframes bubble-exhaust' "$game/styles.css"
          ! grep -Fq 'class="flame"' "$game/game.js"
          ! grep -Fq '@keyframes flame' "$game/styles.css"

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          ones = int(os.environ["ONES_COUNT"])
          canonical = f"/v{version}/"
          assert version.split(".") == ["1"] * ones

          for path in (Path("dist/site/index.html"), Path(f"dist/site/v{version}/index.html")):
              text = path.read_text(encoding="utf-8")
              found = re.findall(r"/v(?:1\.)*1/", text)
              assert found, f"No immutable URL in {path}"
              assert all(item == canonical for item in found), (path, found, canonical)

          latest = json.loads(Path("dist/site/latest-version.json").read_text(encoding="utf-8"))
          assert latest["version"] == version
          assert latest["immutable"] == canonical
          print(f"verified Версия {ones}: v{version}; immutable {canonical}; clickable carbonation game present")
          PY

      - name: Upload builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvassistent-${{ steps.release-meta.outputs.version }}-publication-log
          path: publication-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-meta.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ONES_COUNT: ${{ needs.build.outputs.ones_count }}
      TAG: v${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="release/RELEASE-${VERSION}.md"
          comic="share/kvassistent-${VERSION}-comic.svg"
          test -s "$notes"
          test -s "$comic"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "КВАССИСТЕНТ · Версия ${ONES_COUNT}" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "КВАССИСТЕНТ · Версия ${ONES_COUNT}" --notes-file "$notes"
          fi
          gh release upload "$TAG" \
            dist/publication/*.pdf dist/publication/manifest.json \
            "dist/kvas-${VERSION}-publication.zip" \
            "dist/kvas-${VERSION}-publication.tar.gz" \
            "dist/kvassistent-${VERSION}-website.zip" \
            "dist/kvassistent-${VERSION}-website.tar.gz" \
            "$comic" --clobber

  pages:
    name: Publish verified website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist
      - name: Force-publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kvassistent-site
          mkdir -p /tmp/kvassistent-site
          cp -a dist/site/. /tmp/kvassistent-site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages-build
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kvassistent-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish KVASSISTENT Версия ${{ needs.build.outputs.ones_count }}"
          git push origin HEAD:gh-pages --force

  live-check:
    name: Verify production
    needs: [build, pages]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ONES_COUNT: ${{ needs.build.outputs.ones_count }}

    steps:
      - name: Wait for site and backend
        shell: bash
        run: |
          set -euo pipefail
          root="https://kvassistent.pages.dev"
          immutable="$root/v${VERSION}"
          backend="https://q49g8jkjoe.execute-api.eu-west-1.amazonaws.com/default/kvassistent/status"

          for attempt in $(seq 1 40); do
            ok=1
            curl --fail --location --silent --show-error "$root/latest-version.json" -o /tmp/latest.json || ok=0
            grep -Fq "\"version\": \"${VERSION}\"" /tmp/latest.json 2>/dev/null || ok=0
            grep -Fq "\"immutable\": \"/v${VERSION}/\"" /tmp/latest.json 2>/dev/null || ok=0

            curl --fail --location --silent --show-error "$root/" -o /tmp/home.html || ok=0
            grep -Fq "Версия ${ONES_COUNT}" /tmp/home.html 2>/dev/null || ok=0
            grep -Fq "v${VERSION}" /tmp/home.html 2>/dev/null || ok=0

            curl --fail --location --silent --show-error "$immutable/manifest.json" -o /tmp/manifest.json || ok=0
            grep -Fq "\"ones_count\": ${ONES_COUNT}" /tmp/manifest.json 2>/dev/null || ok=0

            curl --fail --location --silent --show-error "$immutable/companion/game/index.html" -o /tmp/game.html || ok=0
            grep -Fq 'id="globe"' /tmp/game.html 2>/dev/null || ok=0
            grep -Fq 'tabindex="0"' /tmp/game.html 2>/dev/null || ok=0
            curl --fail --location --silent --show-error "$immutable/companion/game/game.js" -o /tmp/game.js || ok=0
            grep -Fq 'globe.addEventListener("click"' /tmp/game.js 2>/dev/null || ok=0
            grep -Fq 'class="gas-bubble b1"' /tmp/game.js 2>/dev/null || ok=0
            curl --fail --location --silent --show-error "$immutable/companion/game/styles.css" -o /tmp/game.css || ok=0
            grep -Fq '@keyframes bubble-exhaust' /tmp/game.css 2>/dev/null || ok=0
            grep -Fq '.paper-wing' /tmp/game.css 2>/dev/null || ok=0
            grep -Fq '@keyframes flame' /tmp/game.css 2>/dev/null && ok=0 || true

            curl --fail --location --silent --show-error "$backend" -o /tmp/backend.json || ok=0
            jq -e --arg version "v${VERSION}" --argjson release "$ONES_COUNT" \
              '.ok == true and .ready == true and .version == $version and .release_number == $release and .next_release_number == ($release + 1)' \
              /tmp/backend.json >/dev/null 2>&1 || ok=0

            if [ "$ok" -eq 1 ]; then
              echo "Verified KVASSISTENT Версия ${ONES_COUNT}: site, immutable URL, clickable carbonation game and backend"
              exit 0
            fi
            echo "Waiting for production ($attempt/40)..."
            sleep 10
          done

          echo "Production verification failed for Версия ${ONES_COUNT}" >&2
          cat /tmp/latest.json >&2 2>/dev/null || true
          cat /tmp/backend.json >&2 2>/dev/null || true
          exit 1
