name: Finalize KVASSISTENT release 26 publication

on:
  push:
    branches:
      - agent/release-v26-consistent-versioning
    paths:
      - scripts/fix_release_v26_redirect_metadata.py
      - .github/workflows/apply-release-v26.yml
  pull_request:
    branches:
      - develop
    paths:
      - scripts/fix_release_v26_redirect_metadata.py
      - .github/workflows/apply-release-v26.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/release-v26-consistent-versioning' || github.ref_name == 'agent/release-v26-consistent-versioning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v26-consistent-versioning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix redirect metadata handling and verify source
        run: |
          python scripts/fix_release_v26_redirect_metadata.py
          python -m py_compile \
            scripts/fix_release_v26_redirect_metadata.py \
            scripts/build-release.py \
            scripts/finalize-release.py \
            scripts/check-version-consistency.py
          python scripts/check-version-consistency.py
      - name: Commit final publication fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/finalize-release.py
          git commit -m "Skip metadata injection for redirect wrappers" || exit 0
          git push origin HEAD:agent/release-v26-consistent-versioning
