name: Verify KVASSISTENT release 26 version contract

on:
  push:
    branches:
      - agent/release-v26-consistent-versioning
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify-version-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical version contract
        run: |
          python -m py_compile \
            scripts/build-release.py \
            scripts/finalize-release.py \
            scripts/check-version-consistency.py
          python scripts/check-version-consistency.py
