name: Publish 1.0.5 PDFs and multilingual website

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: "1.0.5"
  TAG: "v1.0.5"

concurrency:
  group: publish-1.0.5-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify publication
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install PDF and font dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-mono \
            poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt
          fc-cache -f

      - name: Build identical multilingual PDFs and web pages
        run: python scripts/build-publication.py

      - name: Package generated website
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist/site
            zip -qr "../kvas-${VERSION}-website.zip" .
          )
          tar -C dist/site -czf "dist/kvas-${VERSION}-website.tar.gz" .

      - name: Verify publication outputs
        shell: bash
        run: |
          set -euo pipefail

          expected_languages=(ru en es de zh-CN)
          expected_types=(summary instructions)

          for lang in "${expected_languages[@]}"; do
            for type in "${expected_types[@]}"; do
              pdf="dist/publication/kvas-${type}-${lang}-${VERSION}.pdf"
              web="dist/site/v${VERSION}/${lang}/${type}/index.html"
              test -s "$pdf"
              test -s "$web"
              pdfinfo "$pdf" | grep -q '^Pages:'
              pdftoppm -f 1 -singlefile -png -r 72 "$pdf" "/tmp/${type}-${lang}" >/dev/null
              test -s "/tmp/${type}-${lang}.png"
            done
          done

          test "$(find dist/publication -maxdepth 1 -name '*.pdf' | wc -l)" -eq 10
          test -s "dist/kvas-${VERSION}-publication.zip"
          test -s "dist/kvas-${VERSION}-publication.tar.gz"
          test -s "dist/kvas-${VERSION}-website.zip"
          test -s "dist/kvas-${VERSION}-website.tar.gz"
          test -s "dist/site/v${VERSION}/manifest.json"

      - name: Upload verified publication build
        uses: actions/upload-artifact@v4
        with:
          name: kvas-1.0.5-publication-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified publication
        uses: actions/download-artifact@v4
        with:
          name: kvas-1.0.5-publication-build
          path: dist

      - name: Point v1.0.5 tag to the verified commit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Create or update GitHub Release with PDFs and website
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Квас 1.0.5 — PDFs and multilingual website" \
              --notes-file release/RELEASE-1.0.5.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Квас 1.0.5 — PDFs and multilingual website" \
              --notes-file release/RELEASE-1.0.5.md
          fi

          gh release delete-asset "$TAG" "kvas-1.0.5.zip" -y 2>/dev/null || true
          gh release delete-asset "$TAG" "kvas-1.0.5.tar.gz" -y 2>/dev/null || true

          gh release upload "$TAG" \
            dist/publication/*.pdf \
            dist/publication/manifest.json \
            dist/kvas-1.0.5-publication.zip \
            dist/kvas-1.0.5-publication.tar.gz \
            dist/kvas-1.0.5-website.zip \
            dist/kvas-1.0.5-website.tar.gz \
            --clobber

  gh-pages-branch:
    name: Publish website to gh-pages branch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified publication
        uses: actions/download-artifact@v4
        with:
          name: kvas-1.0.5-publication-build
          path: dist

      - name: Force-publish static website branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kvas-site
          mkdir -p /tmp/kvas-site
          cp -a dist/site/. /tmp/kvas-site/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages-build
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kvas-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish Kvas 1.0.5 multilingual website"
          git push origin HEAD:gh-pages --force

  github-pages-actions:
    name: Deploy with GitHub Pages Actions
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download verified publication
        uses: actions/download-artifact@v4
        with:
          name: kvas-1.0.5-publication-build
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload multilingual website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy multilingual website
        id: deployment
        uses: actions/deploy-pages@v4
