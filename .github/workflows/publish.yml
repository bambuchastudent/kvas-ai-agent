name: Publish KVASSISTENT release

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-kvassistent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify publication once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      ones_count: ${{ steps.release-meta.outputs.ones_count }}
      artifact_name: ${{ steps.release-meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read release metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          meta = json.loads(Path("release/version.json").read_text(encoding="utf-8"))
          print(f"version={meta['current']}")
          print(f"ones_count={meta['ones_count']}")
          print(f"artifact_name=kvassistent-{meta['current']}-publication-build")
          PY
          VERSION="$(python -c 'import json; print(json.load(open("release/version.json"))["current"])')"
          ONES_COUNT="$(python -c 'import json; print(json.load(open("release/version.json"))["ones_count"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ONES_COUNT=$ONES_COUNT" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install PDF and font dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-mono \
            poppler-utils
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -r requirements-publication.txt
          fc-cache -f >/dev/null

      - name: Prepare, test, build and enhance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-release.py
          python -m py_compile \
            scripts/build-release.py \
            scripts/prepare-release.py \
            scripts/enhance-release.py \
            scripts/next-ones-version.py
          node scripts/test-companion.mjs
          node scripts/test-localization.mjs
          python scripts/build-release.py 2>&1 | tee publication-build.log
          python scripts/enhance-release.py

      - name: Package generated website
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/site && zip -qr "../kvassistent-${VERSION}-website.zip" .)
          tar -C dist/site -czf "dist/kvassistent-${VERSION}-website.tar.gz" .

      - name: Verify immutable release and stable latest URLs
        shell: bash
        run: |
          set -euo pipefail
          expected_languages=(ru en es de zh-CN el)
          expected_types=(summary instructions)

          for lang in "${expected_languages[@]}"; do
            for type in "${expected_types[@]}"; do
              pdf="dist/publication/kvas-${type}-${lang}-${VERSION}.pdf"
              immutable_web="dist/site/v${VERSION}/${lang}/${type}/index.html"
              latest_web="dist/site/${lang}/${type}/index.html"
              test -s "$pdf"
              test -s "$immutable_web"
              test -s "$latest_web"
              pdfinfo "$pdf" | grep -q '^Pages:'
              pdftoppm -f 1 -singlefile -png -r 72 "$pdf" "/tmp/${type}-${lang}" >/dev/null
              test -s "/tmp/${type}-${lang}.png"
            done
          done

          immutable="dist/site/v${VERSION}"
          landing="$immutable/index.html"
          game="$immutable/companion/game/index.html"
          companion="$immutable/companion/index.html"
          comic="$immutable/assets/kvassistent-${VERSION}-comic.svg"

          test "$(find dist/publication -maxdepth 1 -name '*.pdf' | wc -l)" -eq 12
          test -s "dist/kvas-${VERSION}-publication.zip"
          test -s "dist/kvas-${VERSION}-publication.tar.gz"
          test -s "dist/kvassistent-${VERSION}-website.zip"
          test -s "dist/kvassistent-${VERSION}-website.tar.gz"
          test -s "$immutable/manifest.json"
          test -s "$immutable/version.json"
          test -s "$landing"
          test -s "$game"
          test -s "$companion"
          test -s "$comic"
          test -s "$immutable/telegram/index.html"

          grep -Fq "Версия ${ONES_COUNT}, потому что в ней единиц вот столько: ${ONES_COUNT}. Пересчитай:" "$landing"
          grep -Fq "v${VERSION}" "$landing"
          grep -Fq 'id="site-topbar"' "$landing"
          grep -Fq 'id="header-language-select"' "$landing"
          grep -Fq 'id="globe-game"' "$landing"
          grep -Fq 'id="all-links"' "$landing"
          grep -Fq 'id="localization"' "$landing"
          grep -Fq 'id="human-manifesto"' "$landing"
          grep -Fq 'kvass-space-layer' "$landing"
          grep -Fq 'ЭТО ТВОЙ КВАС делай с ним что хочешь' "$landing"
          grep -Fq 'href="/game/"' "$landing"
          grep -Fq 'href="/companion/"' "$landing"
          grep -Fq 'href="/feedback/"' "$landing"
          grep -Fq 'href="/telegram/"' "$landing"
          grep -Fq "kvassistent-${VERSION}-comic.svg" "$landing"

          grep -Fq "VERSION ${ONES_COUNT}" "$game"
          grep -Fq 'id="game-language"' "$game"
          test "$(grep -o 'class="site"' "$game" | wc -l)" -eq 6
          grep -Fq 'resolveGameLanguage' "$immutable/companion/game/game.js"
          grep -Fq 'zh-CN' "$immutable/companion/game/i18n.js"
          grep -Fq "ΕΚΔΟΣΗ ${ONES_COUNT}" "$immutable/companion/game/i18n.js"

          grep -Fq 'Live batch' "$companion"
          grep -Fq 'Straightforward kvass' "$companion"
          grep -Fq 'id="consent-card"' "$companion"
          grep -Fq 'data-consent="essential"' "$companion"
          grep -Fq 'option value="el"' "$companion"
          grep -Fq "kvassistent-live-v${ONES_COUNT}" "$immutable/companion/sw.js"
          grep -Fq 'formsubmit.co/kvassitent@gmail.com' "$immutable/feedback/index.html"

          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('dist/site/v' + os.environ['VERSION'] + '/companion/index.html').read_text(encoding='utf-8')
          assert not any(('А' <= ch <= 'я') or ch in 'Ёё' for ch in text), 'Russian leaked into universal companion shell'
          PY

          test -s dist/site/index.html
          test -s dist/site/game/index.html
          test -s dist/site/companion/index.html
          test -s dist/site/feedback/index.html
          test -s dist/site/telegram/index.html
          test -s dist/site/latest-version.json
          grep -Fq "\"version\": \"${VERSION}\"" dist/site/latest-version.json
          grep -Fq '"telegram": "/telegram/"' dist/site/latest-version.json
          grep -Fq 'id="human-manifesto"' dist/site/index.html
          grep -Fq 'id="game-language"' dist/site/game/index.html
          grep -Fq 'Live batch' dist/site/companion/index.html
          grep -Fq "\"ones_count\": ${ONES_COUNT}" "$immutable/manifest.json"

      - name: Upload builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvassistent-${{ steps.release-meta.outputs.version }}-publication-log
          path: publication-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified publication build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-meta.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ONES_COUNT: ${{ needs.build.outputs.ones_count }}
      TAG: v${{ needs.build.outputs.version }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified publication
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Create or update tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="release/RELEASE-${VERSION}.md"
          title="КВАССИСТЕНТ ${VERSION} · единиц: ${ONES_COUNT}"
          test -s "$notes"
          test -s "share/kvassistent-${VERSION}-comic.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fi
          gh release upload "$TAG" \
            dist/publication/*.pdf \
            dist/publication/manifest.json \
            "dist/kvas-${VERSION}-publication.zip" \
            "dist/kvas-${VERSION}-publication.tar.gz" \
            "dist/kvassistent-${VERSION}-website.zip" \
            "dist/kvassistent-${VERSION}-website.tar.gz" \
            "share/kvassistent-${VERSION}-comic.svg" \
            --clobber

  gh-pages-branch:
    name: Publish the already verified website
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout for branch publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified publication
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Force-publish static website branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kvassistent-site
          mkdir -p /tmp/kvassistent-site
          cp -a dist/site/. /tmp/kvassistent-site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages-build
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kvassistent-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish KVASSISTENT ${{ needs.build.outputs.version }} website"
          git push origin HEAD:gh-pages --force

  verify-cloudflare-pages:
    name: Verify Cloudflare Pages deployment
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, gh-pages-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ONES_COUNT: ${{ needs.build.outputs.ones_count }}

    steps:
      - name: Wait for immutable and latest URLs
        shell: bash
        run: |
          set -euo pipefail
          root="https://kvassistent.pages.dev"
          immutable="$root/v${VERSION}"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error "$root/latest-version.json" -o /tmp/latest-version.json \
              && grep -Fq "\"version\": \"${VERSION}\"" /tmp/latest-version.json \
              && grep -Fq '"telegram": "/telegram/"' /tmp/latest-version.json \
              && curl --fail --location --silent --show-error "$root/" -o /tmp/latest.html \
              && grep -Fq "v${VERSION}" /tmp/latest.html \
              && grep -Fq 'id="human-manifesto"' /tmp/latest.html \
              && grep -Fq 'kvass-space-layer' /tmp/latest.html \
              && curl --fail --location --silent --show-error "$root/game/" -o /tmp/game.html \
              && grep -Fq "VERSION ${ONES_COUNT}" /tmp/game.html \
              && curl --fail --location --silent --show-error "$root/companion/" -o /tmp/companion.html \
              && grep -Fq 'Live batch' /tmp/companion.html \
              && curl --fail --location --silent --show-error "$root/telegram/" -o /tmp/telegram.html \
              && grep -Fq 'Telegram-бот подготовлен' /tmp/telegram.html \
              && curl --fail --location --silent --show-error "$immutable/manifest.json" -o /tmp/immutable-manifest.json \
              && grep -Fq "\"version\": \"${VERSION}\"" /tmp/immutable-manifest.json \
              && curl --fail --location --silent --show-error "$immutable/" -o /tmp/immutable.html \
              && grep -Fq 'id="human-manifesto"' /tmp/immutable.html; then
              echo "Verified KVASSISTENT ${VERSION}: latest, Telegram, game, companion and immutable release"
              exit 0
            fi
            echo "Waiting for Cloudflare Pages ($attempt/24)..."
            sleep 10
          done
          echo "Cloudflare Pages did not publish release ${VERSION} in time." >&2
          exit 1
