name: Publish KVASSISTENT release

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-kvassistent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      ones_count: ${{ steps.release-meta.outputs.ones_count }}
      display: ${{ steps.release-meta.outputs.display }}
      artifact_name: ${{ steps.release-meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          meta = json.loads(Path("release/version.json").read_text(encoding="utf-8"))
          print(f"version={meta['current']}")
          print(f"ones_count={meta['ones_count']}")
          print(f"display={meta['display']}")
          print(f"artifact_name=kvassistent-{meta['current']}-publication-build")
          PY
          VERSION="$(python -c 'import json; print(json.load(open("release/version.json"))["current"])')"
          ONES_COUNT="$(python -c 'import json; print(json.load(open("release/version.json"))["ones_count"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ONES_COUNT=$ONES_COUNT" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install PDF and font dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-mono \
            poppler-utils
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -r requirements-publication.txt
          fc-cache -f >/dev/null

      - name: Build multilingual publication and comic website
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-companion.mjs
          python scripts/build-release.py 2>&1 | tee publication-build.log

      - name: Upload publication builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvassistent-${{ steps.release-meta.outputs.version }}-publication-log
          path: publication-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package generated website
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist/site
            zip -qr "../kvassistent-${VERSION}-website.zip" .
          )
          tar -C dist/site -czf "dist/kvassistent-${VERSION}-website.tar.gz" .

      - name: Verify publication outputs, homepage and comic
        shell: bash
        run: |
          set -euo pipefail
          expected_languages=(ru en es de zh-CN)
          expected_types=(summary instructions)

          for lang in "${expected_languages[@]}"; do
            for type in "${expected_types[@]}"; do
              pdf="dist/publication/kvas-${type}-${lang}-${VERSION}.pdf"
              web="dist/site/v${VERSION}/${lang}/${type}/index.html"
              test -s "$pdf"
              test -s "$web"
              pdfinfo "$pdf" | grep -q '^Pages:'
              pdftoppm -f 1 -singlefile -png -r 72 "$pdf" "/tmp/${type}-${lang}" >/dev/null
              test -s "/tmp/${type}-${lang}.png"
            done
          done

          landing="dist/site/v${VERSION}/index.html"
          comic="dist/site/v${VERSION}/assets/kvassistent-${VERSION}-comic.svg"
          companion="dist/site/v${VERSION}/companion"
          test "$(find dist/publication -maxdepth 1 -name '*.pdf' | wc -l)" -eq 10
          test -s "dist/kvas-${VERSION}-publication.zip"
          test -s "dist/kvas-${VERSION}-publication.tar.gz"
          test -s "dist/kvassistent-${VERSION}-website.zip"
          test -s "dist/kvassistent-${VERSION}-website.tar.gz"
          test -s "dist/site/v${VERSION}/manifest.json"
          test -s "dist/site/v${VERSION}/version.json"
          test -s "$landing"
          test -s "$comic"
          test -s "$companion/index.html"
          test -s "$companion/app.js"
          test -s "$companion/engine.js"
          test -s "$companion/styles.css"
          test -s "$companion/manifest.webmanifest"
          test -s "$companion/sw.js"
          grep -q '<h1>ТВОЙ ЛИЧНЫЙ КВАССИСТЕНТ</h1>' "$landing"
          grep -q 'ИИ управляет приготовлением кваса «Жижа». Ты делаешь его своими руками.' "$landing"
          grep -q 'Лучшие инструкции для людей' "$landing"
          grep -q 'id="hot-fermentation"' "$landing"
          grep -q 'id="comic-guide"' "$landing"
          grep -q 'Реальная партия — в простом комиксе' "$landing"
          grep -q 'id="live-batch"' "$landing"
          grep -q 'href="companion/"' "$landing"
          grep -q 'Один ИИ-агент — одна понятная партия кваса' "$landing"
          grep -q 'href="ru/instructions/"' "$landing"
          grep -q 'Живая партия' "$companion/index.html"
          grep -q 'Простой квас без догадок' "$companion/index.html"
          grep -q 'kvassistent-live-batch-v1' "$companion/engine.js"
          grep -q "kvassistent-${VERSION}-comic.svg" "$landing"
          grep -q 'id="for-people"' "$landing"
          grep -q 'id="for-ai-agents"' "$landing"
          grep -q 'Для ИИ-агентов' "$landing"
          grep -q 'Open human guide' "$landing"
          grep -q 'Abrir guía para personas' "$landing"
          grep -q 'Anleitung für Menschen' "$landing"
          grep -q '打开用户指南' "$landing"
          grep -q 'AI agent instructions' "$landing"
          grep -q 'Instrucciones para agente de IA' "$landing"
          grep -q 'Anleitung für KI-Agenten' "$landing"
          grep -q 'AI 智能体说明' "$landing"
          grep -q "единиц: ${ONES_COUNT}" "$landing"
          grep -q 'beer-background' "$landing"
          grep -q 'Галерея успешных напитков' "$landing"
          grep -q 'prefers-reduced-motion' "$landing"
          grep -q "\"ones_count\": ${ONES_COUNT}" "dist/site/v${VERSION}/manifest.json"

      - name: Upload verified publication build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-meta.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ONES_COUNT: ${{ needs.build.outputs.ones_count }}
      TAG: v${{ needs.build.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified publication
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Point release tag to the verified commit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="release/RELEASE-${VERSION}.md"
          title="КВАССИСТЕНТ ${VERSION} · единиц: ${ONES_COUNT}"
          test -s "$notes"
          test -s "share/kvassistent-${VERSION}-comic.svg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fi
          gh release upload "$TAG" \
            dist/publication/*.pdf \
            dist/publication/manifest.json \
            "dist/kvas-${VERSION}-publication.zip" \
            "dist/kvas-${VERSION}-publication.tar.gz" \
            "dist/kvassistent-${VERSION}-website.zip" \
            "dist/kvassistent-${VERSION}-website.tar.gz" \
            "share/kvassistent-${VERSION}-comic.svg" \
            --clobber

  gh-pages-branch:
    name: Publish website to gh-pages branch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified publication
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Force-publish static website branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kvassistent-site
          mkdir -p /tmp/kvassistent-site
          cp -a dist/site/. /tmp/kvassistent-site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages-build
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kvassistent-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish КВАССИСТЕНТ ${VERSION} multilingual website"
          git push origin HEAD:gh-pages --force

  verify-cloudflare-pages:
    name: Verify automatic Cloudflare Pages deployment
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, gh-pages-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ONES_COUNT: ${{ needs.build.outputs.ones_count }}

    steps:
      - name: Wait for KVASSISTENT deployment
        shell: bash
        run: |
          set -euo pipefail
          site="https://kvassistent.pages.dev/v${VERSION}"
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error \
                 "$site/manifest.json" -o /tmp/manifest.json \
              && grep -q "\"version\": \"${VERSION}\"" /tmp/manifest.json \
              && grep -q "\"ones_count\": ${ONES_COUNT}" /tmp/manifest.json \
              && curl --fail --location --silent --show-error \
                 "$site/ru/summary/index.html" -o /tmp/ru-summary.html \
              && grep -q "Version ${VERSION}" /tmp/ru-summary.html \
              && curl --fail --location --silent --show-error \
                 "$site/index.html" -o /tmp/landing.html \
              && grep -q '<h1>ТВОЙ ЛИЧНЫЙ КВАССИСТЕНТ</h1>' /tmp/landing.html \
              && grep -q 'id="comic-guide"' /tmp/landing.html \
              && grep -q 'Реальная партия — в простом комиксе' /tmp/landing.html \
              && grep -q "единиц: ${ONES_COUNT}" /tmp/landing.html \
              && curl --fail --location --silent --show-error \
                 "$site/assets/kvassistent-${VERSION}-comic.svg" -o /tmp/comic.svg \
              && grep -q '<svg' /tmp/comic.svg \
              && grep -q 'КВАССИСТЕНТ' /tmp/comic.svg \
              && curl --fail --location --silent --show-error \
                 "$site/companion/index.html" -o /tmp/companion.html \
              && grep -q 'Живая партия' /tmp/companion.html \
              && grep -q 'Простой квас без догадок' /tmp/companion.html \
              && curl --fail --location --silent --show-error \
                 "$site/companion/engine.js" -o /tmp/companion-engine.js \
              && grep -q 'kvassistent-live-batch-v1' /tmp/companion-engine.js; then
              echo "Verified $site, comic asset, and live-batch companion"
              exit 0
            fi
            echo "Waiting for Cloudflare Pages ($attempt/30)..."
            sleep 10
          done
          echo "Cloudflare Pages did not publish version ${VERSION} in time." >&2
          exit 1
