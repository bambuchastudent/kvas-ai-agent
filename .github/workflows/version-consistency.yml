name: KVASSISTENT version consistency

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check human, technical and immutable versions
        run: |
          python -m py_compile scripts/check-version-consistency.py scripts/build-release.py scripts/finalize-release.py
          python scripts/check-version-consistency.py
