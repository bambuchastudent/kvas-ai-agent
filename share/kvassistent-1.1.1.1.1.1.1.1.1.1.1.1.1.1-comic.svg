    <g transform="translate(55 390) rotate(180)"><rect x="-20" y="-55" width="40" height="110" rx="15" fill="#dff3ff" fill-opacity=".35" class="rocket"/><rect x="-15" y="2" width="30" height="44" rx="8" fill="url(#kvass)"/><path d="M-20 28l-28 34h28zM20 28l28 34H20z" fill="#e56b32"/><path d="M0 55q-18 50 0 80q18-30 0-80" fill="#ff922e"/></g>
    <g transform="translate(390 -220) rotate(45)"><rect x="-20" y="-55" width="40" height="110" rx="15" fill="#dff3ff" fill-opacity=".35" class="rocket"/><rect x="-15" y="2" width="30" height="44" rx="8" fill="url(#kvass)"/><path d="M-20 28l-28 34h28zM20 28l28 34H20z" fill="#e56b32"/><path d="M0 55q-18 50 0 80q18-30 0-80" fill="#ff922e"/></g>
    <g transform="translate(390 280) rotate(135)"><rect x="-20" y="-55" width="40" height="110" rx="15" fill="#dff3ff" fill-opacity=".35" class="rocket"/><rect x="-15" y="2" width="30" height="44" rx="8" fill="url(#kvass)"/><path d="M-20 28l-28 34h28zM20 28l28 34H20z" fill="#e56b32"/><path d="M0 55q-18 50 0 80q18-30 0-80" fill="#ff922e"/></g>
  </g>

  <rect x="90" y="1430" width="1020" height="250" rx="30" fill="#071020" stroke="#f4ba3b" stroke-width="4"/>
  <text x="130" y="1495" class="sub">ИГРА НА СФЕРЕ</text>
  <text x="130" y="1545" class="small">• 6 точек запуска закреплены прямо на глобусе</text>
  <text x="130" y="1585" class="small">• бутылки стартуют каждые 10 секунд или по нажатию</text>
  <text x="130" y="1625" class="small">• общий и континентальные счётчики хранятся локально</text>
  <text x="130" y="1665" class="small">• режим: максимум газиков без разгона алкоголя</text>
</svg>
