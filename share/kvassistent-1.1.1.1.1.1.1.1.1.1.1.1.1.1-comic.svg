<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">КВАССИСТЕНТ 14 — игра на глобусе</title>
  <desc id="desc">Сферический глобус в космосе, шесть точек запуска на континентах, бутылки-ракеты, локальный счётчик и автозапуск каждые десять секунд.</desc>
  <defs>
    <radialGradient id="space"><stop stop-color="#142852"/><stop offset="1" stop-color="#030711"/></radialGradient>
    <radialGradient id="earth" cx="30%" cy="24%"><stop stop-color="#83d7ff"/><stop offset=".28" stop-color="#1d82d1"/><stop offset=".62" stop-color="#09569f"/><stop offset="1" stop-color="#021a3c"/></radialGradient>
    <linearGradient id="kvass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e3ad43"/><stop offset="1" stop-color="#6a3419"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.title{font:900 72px DejaVu Sans,sans-serif;fill:#f4ba3b}.sub{font:800 30px DejaVu Sans,sans-serif;fill:#fff4ce}.label{font:800 21px DejaVu Sans,sans-serif;fill:#fff}.small{font:600 18px DejaVu Sans,sans-serif;fill:#c8d5eb}.line{stroke:#f4ba3b;stroke-width:5}.land{fill:#78ad4e;stroke:#ded38c;stroke-width:3}.rocket{stroke:#dff3ff;stroke-width:4}</style>
  </defs>
  <rect width="1200" height="1800" fill="url(#space)"/>
  <g fill="#fff" opacity=".75"><circle cx="110" cy="130" r="2"/><circle cx="1010" cy="150" r="3"/><circle cx="900" cy="360" r="2"/><circle cx="240" cy="470" r="2"/><circle cx="1060" cy="700" r="2"/><circle cx="150" cy="960" r="3"/><circle cx="965" cy="1240" r="2"/></g>
  <text x="600" y="105" text-anchor="middle" class="title">КВАССИСТЕНТ</text>
  <text x="600" y="158" text-anchor="middle" class="sub">ВЕРСИЯ 14 · ГЛОБУС, А НЕ ПЛОСКАЯ КАРТА</text>
  <rect x="850" y="190" width="270" height="105" rx="24" fill="#071020" stroke="#f4ba3b" stroke-width="4"/>
  <text x="985" y="228" text-anchor="middle" class="small">ЗАПУЩЕНО БУТЫЛОК</text><text x="985" y="275" text-anchor="middle" class="sub">1 248</text>
  <rect x="80" y="198" width="310" height="90" rx="23" fill="#071020" stroke="#7aa8e8" stroke-width="3"/>
  <text x="235" y="235" text-anchor="middle" class="small">АВТОЗАПУСК: 10 СЕК</text><text x="235" y="267" text-anchor="middle" class="small">ЛОКАЛЬНО КОПИТСЯ</text>

  <g transform="translate(600 900)">
    <circle r="420" fill="url(#earth)" stroke="#b7e5ff" stroke-width="5" filter="url(#glow)"/>
    <path class="land" d="M-330-150l80-105 120-25 96 54 8 78-56 64-32 82-92 14-60-58-76-30z"/>
    <path class="land" d="M-155 30l70 28 45 86-20 72 36 65-58 134-52-49-8-96-45-67 10-91z"/>
    <path class="land" d="M-40-230l58-36 82 10 43 42-24 42-65 8-47-20z"/>
    <path class="land" d="M6-100l85-42 72 45 34 90-31 90-21 126-68 90-43-83-17-84-42-78 22-68z"/>
    <path class="land" d="M98-238l132-65 112 27 55 79-21 91-92 43-51 91-84-24-37-92-84-52z"/>
    <path class="land" d="M274 132l75-32 58 28-11 67-66 36-55-39z"/>
    <ellipse rx="360" ry="120" fill="none" stroke="#9bcfff" stroke-opacity=".25" stroke-width="3"/>
    <ellipse rx="230" ry="420" fill="none" stroke="#9bcfff" stroke-opacity=".2" stroke-width="3"/>

    <g id="sites" fill="#f4ba3b" stroke="#fff1b8" stroke-width="3">
