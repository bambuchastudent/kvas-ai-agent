<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="25%" stop-color="#ffd969"/>
      <stop offset="60%" stop-color="#efb42f"/>
      <stop offset="100%" stop-color="#a05f0a"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#fff6a6" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff6a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottle" cx="35%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#3b1c04"/>
      <stop offset="55%" stop-color="#1b0a02"/>
      <stop offset="100%" stop-color="#0a0501"/>
    </radialGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff2c8"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- beer background -->
  <rect width="1200" height="800" fill="url(#beer)"/>
  <rect width="1200" height="800" fill="url(#topGlow)"/>

  <!-- foam ribbon at top -->
  <g opacity=".9">
    <path d="M0,80 C120,10 250,120 400,60 C560,-5 700,110 880,55 C1050,5 1180,90 1200,60 L1200,0 L0,0 Z" fill="url(#foam)"/>
    <circle cx="90" cy="60" r="18" fill="#ffffff" opacity=".95"/>
    <circle cx="260" cy="42" r="12" fill="#ffffff" opacity=".85"/>
    <circle cx="470" cy="70" r="20" fill="#ffffff" opacity=".9"/>
    <circle cx="670" cy="46" r="14" fill="#ffffff" opacity=".85"/>
    <circle cx="880" cy="75" r="22" fill="#ffffff" opacity=".95"/>
    <circle cx="1080" cy="52" r="16" fill="#ffffff" opacity=".88"/>
  </g>

  <!-- rising beer bubbles -->
  <g stroke="rgba(255,255,235,.8)" stroke-width="2" fill="rgba(255,247,190,.22)">
    <circle cx="80" cy="720" r="14"/>
    <circle cx="140" cy="620" r="9"/>
    <circle cx="55" cy="520" r="12"/>
    <circle cx="180" cy="440" r="7"/>
    <circle cx="100" cy="340" r="10"/>
    <circle cx="60" cy="240" r="6"/>
    <circle cx="220" cy="260" r="14"/>
    <circle cx="240" cy="700" r="18"/>
    <circle cx="320" cy="580" r="10"/>
    <circle cx="380" cy="720" r="12"/>
    <circle cx="440" cy="600" r="8"/>
    <circle cx="500" cy="700" r="14"/>
    <circle cx="1060" cy="720" r="16"/>
    <circle cx="1130" cy="600" r="10"/>
    <circle cx="1000" cy="620" r="8"/>
    <circle cx="1150" cy="490" r="12"/>
    <circle cx="1090" cy="400" r="7"/>
    <circle cx="1160" cy="320" r="14"/>
    <circle cx="1050" cy="260" r="9"/>
    <circle cx="1140" cy="170" r="6"/>
    <circle cx="990" cy="480" r="11"/>
    <circle cx="920" cy="700" r="12"/>
    <circle cx="850" cy="620" r="7"/>
    <circle cx="780" cy="720" r="10"/>
    <circle cx="700" cy="640" r="8"/>
  </g>

  <!-- small highlight in each big bubble -->
  <g fill="rgba(255,255,255,.9)">
    <circle cx="76" cy="716" r="3"/>
    <circle cx="236" cy="696" r="4"/>
    <circle cx="1056" cy="716" r="3.5"/>
    <circle cx="1156" cy="316" r="3"/>
    <circle cx="216" cy="256" r="3"/>
    <circle cx="1146" cy="486" r="3"/>
    <circle cx="496" cy="696" r="3"/>
  </g>

  <!-- bottle silhouette on right, tipped, pouring -->
  <g transform="translate(1000 260) rotate(28)" filter="url(#softShadow)">
    <rect x="-30" y="-140" width="60" height="20" rx="4" fill="#6b2f0b"/>
    <rect x="-38" y="-118" width="76" height="220" rx="18" fill="url(#bottle)" stroke="#ffe7a6" stroke-width="2.5"/>
    <rect x="-32" y="-20" width="64" height="38" rx="4" fill="#f2c05c"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="22" fill="#201005">КВАС</text>
  </g>

  <!-- big central title card -->
  <g transform="translate(70 220)">
    <text font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="108" fill="#3a1e04" letter-spacing="2">KVASSISTENT</text>
    <text y="52" font-family="Arial,sans-serif" font-size="24" fill="#7a4c06" font-weight="700" letter-spacing="6">HUMAN-FIRST AI · REAL KVASS</text>
    <text y="150" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#3a1e04">Turn stale bread</text>
    <text y="198" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#3a1e04">into real kvass.</text>
    <text y="256" font-family="Arial,sans-serif" font-size="26" fill="#6b3f04">AI guides. <tspan fill="#a05f0a" font-weight="900">You brew.</tspan> Just for fun.</text>
  </g>

  <!-- feature pills -->
  <g transform="translate(70 570)">
    <g>
      <rect width="200" height="46" rx="23" fill="#fff7d5" stroke="#a05f0a" stroke-width="1.6"/>
      <text x="100" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#3a1e04" font-weight="800">PWA · offline</text>
    </g>
    <g transform="translate(212 0)">
      <rect width="200" height="46" rx="23" fill="#fff7d5" stroke="#a05f0a" stroke-width="1.6"/>
      <text x="100" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#3a1e04" font-weight="800">i18n · RU / EN + 4</text>
    </g>
    <g transform="translate(0 60)">
      <rect width="200" height="46" rx="23" fill="#fff7d5" stroke="#a05f0a" stroke-width="1.6"/>
      <text x="100" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#3a1e04" font-weight="800">18 released versions</text>
    </g>
    <g transform="translate(212 60)">
      <rect width="200" height="46" rx="23" fill="#fff7d5" stroke="#a05f0a" stroke-width="1.6"/>
      <text x="100" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#3a1e04" font-weight="800">open source</text>
    </g>
  </g>

  <!-- URLs -->
  <text x="70" y="750" font-family="Arial,sans-serif" font-size="22" fill="#3a1e04" font-weight="900">kvassistent.pages.dev</text>
  <text x="1130" y="750" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#5a3706">github.com/bambuchastudent/kvas-ai-agent</text>
</svg>
