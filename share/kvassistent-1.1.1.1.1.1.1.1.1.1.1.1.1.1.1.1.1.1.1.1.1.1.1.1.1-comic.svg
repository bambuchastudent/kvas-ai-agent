  <rect x="190" y="670" width="820" height="84" rx="42" fill="#f1bd52"/>
  <text x="600" y="723" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="950" fill="#1b1006">HUMANS BREW · AI GUIDES · LANGUAGE STAYS HERE</text>
