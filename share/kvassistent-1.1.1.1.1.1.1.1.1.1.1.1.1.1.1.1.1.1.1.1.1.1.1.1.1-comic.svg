<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">KVASSISTENT version 25 inline language switching poster</title>
  <desc id="desc">The KVASSISTENT homepage switches Russian, English, Spanish, German, Chinese and Greek content instantly without navigating away.</desc>
  <defs>
    <radialGradient id="space" cx="30%" cy="20%" r="90%"><stop offset="0" stop-color="#2d347d"/><stop offset=".45" stop-color="#10183b"/><stop offset="1" stop-color="#03050d"/></radialGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#f8efcf" stop-opacity=".7"/><stop offset=".35" stop-color="#7a3d0c"/><stop offset="1" stop-color="#1b0c04"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#space)"/>
  <g fill="#fff" opacity=".72"><circle cx="82" cy="92" r="2"/><circle cx="174" cy="164" r="3"/><circle cx="310" cy="74" r="2"/><circle cx="466" cy="122" r="2"/><circle cx="622" cy="58" r="3"/><circle cx="774" cy="146" r="2"/><circle cx="932" cy="82" r="3"/><circle cx="1104" cy="166" r="2"/><circle cx="1040" cy="344" r="2"/><circle cx="116" cy="402" r="3"/></g>
  <g fill="none" stroke="#8cd8ff" stroke-opacity=".22" stroke-width="3"><ellipse cx="600" cy="420" rx="500" ry="235"/><ellipse cx="600" cy="420" rx="430" ry="310" transform="rotate(-18 600 420)"/></g>
  <g transform="translate(90 205) rotate(-16)" filter="url(#glow)"><rect x="0" y="34" width="72" height="190" rx="22" fill="url(#glass)" stroke="#ffe6a1" stroke-width="5"/><rect x="21" width="30" height="50" rx="8" fill="#74320b" stroke="#ffe6a1" stroke-width="5"/><rect x="8" y="112" width="56" height="48" rx="8" fill="#f4bd50"/><text x="36" y="143" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#241103">КВАС</text></g>
  <g transform="translate(978 190) rotate(19) scale(.82)" filter="url(#glow)"><rect x="0" y="34" width="72" height="190" rx="22" fill="url(#glass)" stroke="#ffe6a1" stroke-width="5"/><rect x="21" width="30" height="50" rx="8" fill="#74320b" stroke="#ffe6a1" stroke-width="5"/><rect x="8" y="112" width="56" height="48" rx="8" fill="#f4bd50"/><text x="36" y="143" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#241103">КВАС</text></g>
  <text x="600" y="88" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="900" letter-spacing="5" fill="#ffd66f">KVASSISTENT · VERSION 25</text>
  <text x="600" y="165" text-anchor="middle" font-family="sans-serif" font-size="62" font-weight="950" fill="#fff8dd">ONE PAGE · SIX LANGUAGES</text>
  <text x="600" y="220" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="800" fill="#bfe6ff">NO REDIRECT · NO PAGE CHANGE · INSTANT SWITCH</text>
