      <g transform="translate(175 55)"><rect width="105" height="64" rx="32" fill="#f4ead7"/><text x="52" y="42" fill="#2a2118">EN</text></g>
      <g transform="translate(305 55)"><rect width="105" height="64" rx="32" fill="#f4ead7"/><text x="52" y="42" fill="#2a2118">ES</text></g>
      <g transform="translate(435 55)"><rect width="105" height="64" rx="32" fill="#f4ead7"/><text x="52" y="42" fill="#2a2118">DE</text></g>
      <g transform="translate(565 55)"><rect width="105" height="64" rx="32" fill="#f4ead7"/><text x="52" y="42" fill="#2a2118">中文</text></g>
      <g transform="translate(695 55)"><rect width="90" height="64" rx="32" fill="#f4ead7"/><text x="45" y="42" fill="#2a2118">EL</text></g>
