  <g>
    <rect x="470" y="410" width="220" height="170" rx="22" fill="rgba(255,255,255,.08)" stroke="#d6e3ff" stroke-width="2"/>
    <text x="580" y="450" text-anchor="middle" class="w">Европа</text>
    <text x="580" y="480" text-anchor="middle" class="w" font-size="16">локально копится</text>
    <g transform="translate(558 492) rotate(-4)">
      <path d="M22 95q-8 24 0 40q8-16 0-40" fill="#ff8f2b"/>
      <rect x="12" y="0" width="20" height="20" rx="4" fill="#dfeeff" class="th"/>
      <rect x="0" y="16" width="44" height="84" rx="15" fill="#eef8ff" class="th"/>
      <path d="M4 48h36v40H4z" fill="url(#kvass)"/>
      <path d="M0 70l-16 25H0zM44 70l16 25H44z" fill="#e65444" stroke="#6d231b" stroke-width="3"/>
    </g>
  </g>

  <g>
    <rect x="500" y="670" width="220" height="170" rx="22" fill="rgba(255,255,255,.08)" stroke="#d6e3ff" stroke-width="2"/>
    <text x="610" y="710" text-anchor="middle" class="w">Африка</text>
    <text x="610" y="740" text-anchor="middle" class="w" font-size="16">локально копится</text>
    <g transform="translate(588 752) rotate(10)">
      <path d="M22 95q-8 24 0 40q8-16 0-40" fill="#ff8f2b"/>
      <rect x="12" y="0" width="20" height="20" rx="4" fill="#dfeeff" class="th"/>
      <rect x="0" y="16" width="44" height="84" rx="15" fill="#eef8ff" class="th"/>
