  <rect x="820" y="310" width="280" height="86" rx="18" fill="#0b1020" stroke="#f0bb45" stroke-width="5"/>
  <text x="960" y="348" text-anchor="middle" class="w">Запущено бутылок</text>
  <text x="960" y="383" text-anchor="middle" class="w">локально: 0 → 6 → 12 → ...</text>
  <rect x="96" y="308" width="360" height="58" rx="28" fill="rgba(255,255,255,.1)" stroke="#d6e3ff" stroke-width="2"/>
  <text x="276" y="345" text-anchor="middle" class="w">Автозапуск каждые 10 секунд</text>

  <g>
    <rect x="100" y="420" width="220" height="170" rx="22" fill="rgba(255,255,255,.08)" stroke="#d6e3ff" stroke-width="2"/>
    <text x="210" y="460" text-anchor="middle" class="w">Северная Америка</text>
    <text x="210" y="490" text-anchor="middle" class="w" font-size="16">локально копится</text>
    <g transform="translate(175 500) rotate(-25)">
      <path d="M22 95q-8 24 0 40q8-16 0-40" fill="#ff8f2b"/>
      <rect x="12" y="0" width="20" height="20" rx="4" fill="#dfeeff" class="th"/>
      <rect x="0" y="16" width="44" height="84" rx="15" fill="#eef8ff" class="th"/>
      <path d="M4 48h36v40H4z" fill="url(#kvass)"/>
      <path d="M0 70l-16 25H0zM44 70l16 25H44z" fill="#e65444" stroke="#6d231b" stroke-width="3"/>
    </g>
  </g>

  <g>
    <rect x="150" y="680" width="220" height="170" rx="22" fill="rgba(255,255,255,.08)" stroke="#d6e3ff" stroke-width="2"/>
    <text x="260" y="720" text-anchor="middle" class="w">Южная Америка</text>
    <text x="260" y="750" text-anchor="middle" class="w" font-size="16">локально копится</text>
    <g transform="translate(225 760) rotate(-14)">
