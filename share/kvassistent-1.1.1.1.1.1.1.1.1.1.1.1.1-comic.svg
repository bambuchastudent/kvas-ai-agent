  <rect x="90" y="1090" width="1020" height="250" rx="26" fill="#fff" class="ln"/>
  <text x="130" y="1160" class="h">Логика запуска</text>
  <text x="130" y="1210" class="p">• шесть континентов запускают по одной бутылке-ракете;</text>
  <text x="130" y="1250" class="p">• автозапуск идёт каждые 10 секунд по кругу;</text>
  <text x="130" y="1290" class="p">• общий счётчик локально копится в браузере и показывает накопленный результат.</text>

  <rect x="90" y="1380" width="1020" height="420" rx="26" fill="#eefcf7" class="ln"/>
  <text x="130" y="1450" class="h">Максимальная газированность без алкоголя</text>
  <text x="130" y="1500" class="p">1. Короткая вторичная карбонизация в пищевой ПЭТ — только до момента уверенной упругости.</text>
  <text x="130" y="1540" class="p">2. В жару старт проверки через 60 минут и дальше частый контроль.</text>
  <text x="130" y="1580" class="p">3. Как только газики набраны — сразу в холодильник на 8–12 часов.</text>
  <text x="130" y="1620" class="p">4. Не тянуть тёплое герметичное дображивание, чтобы не наращивать алкоголь.</text>
  <text x="130" y="1680" class="p">5. Идея версии: максимум пузырьков, но не «долгое брожение ради спирта».</text>

  <rect x="90" y="1820" width="1020" height="40" rx="18" fill="#ffe7df" stroke="#8d271e" stroke-width="4"/>
  <text x="600" y="1847" text-anchor="middle" class="p">Ракетные пуски — только веб-анимация. Реальные бутылки с квасом не запускать.</text>
</svg>
