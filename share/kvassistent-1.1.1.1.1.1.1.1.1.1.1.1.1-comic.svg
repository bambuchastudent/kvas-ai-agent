  <g>
    <rect x="860" y="690" width="220" height="170" rx="22" fill="rgba(255,255,255,.08)" stroke="#d6e3ff" stroke-width="2"/>
    <text x="970" y="730" text-anchor="middle" class="w">Океания</text>
    <text x="970" y="760" text-anchor="middle" class="w" font-size="16">локально копится</text>
    <g transform="translate(948 772) rotate(18)">
      <path d="M22 95q-8 24 0 40q8-16 0-40" fill="#ff8f2b"/>
      <rect x="12" y="0" width="20" height="20" rx="4" fill="#dfeeff" class="th"/>
      <rect x="0" y="16" width="44" height="84" rx="15" fill="#eef8ff" class="th"/>
      <path d="M4 48h36v40H4z" fill="url(#kvass)"/>
