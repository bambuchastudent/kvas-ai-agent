    <text x="910" y="470" text-anchor="middle" class="w">Азия</text>
    <text x="910" y="500" text-anchor="middle" class="w" font-size="16">локально копится</text>
    <g transform="translate(888 512) rotate(24)">
      <path d="M22 95q-8 24 0 40q8-16 0-40" fill="#ff8f2b"/>
      <rect x="12" y="0" width="20" height="20" rx="4" fill="#dfeeff" class="th"/>
