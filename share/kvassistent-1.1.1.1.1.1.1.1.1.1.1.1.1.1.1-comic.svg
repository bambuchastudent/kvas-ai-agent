<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">КВАССИСТЕНТ 15 — игра наверху, ссылки на всё и выбор языка</title>
  <desc id="desc">Постер версии 15: на главной странице первым идёт блок игры на глобусе, в шапке есть выбор языка, а отдельный блок собирает все полезные ссылки.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#ffe7b7"/>
    </linearGradient>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1734"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#90ddff"/>
      <stop offset="50%" stop-color="#2d86d4"/>
      <stop offset="100%" stop-color="#0b345e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3b2406" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="40" y="40" width="1320" height="110" rx="28" fill="#fffdf9" stroke="#d7bf8f" filter="url(#shadow)"/>
  <text x="80" y="95" font-size="34" font-weight="900" fill="#5f3a07" font-family="Inter,Arial,sans-serif">КВАССИСТЕНТ</text>
  <text x="80" y="138" font-size="24" font-weight="700" fill="#8a5b17" font-family="Inter,Arial,sans-serif">Версия 15, потому что в ней единиц вот столько: 15</text>
  <g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#2d2417">
    <rect x="760" y="64" width="120" height="46" rx="23" fill="#fff" stroke="#d7bf8f"/>
    <text x="792" y="94">Игра</text>
    <rect x="892" y="64" width="148" height="46" rx="23" fill="#fff" stroke="#d7bf8f"/>
    <text x="922" y="94">Все ссылки</text>
    <rect x="1052" y="64" width="110" height="46" rx="23" fill="#fff" stroke="#d7bf8f"/>
    <text x="1082" y="94">Фидбек</text>
    <rect x="1174" y="64" width="132" height="46" rx="23" fill="#fff" stroke="#d7bf8f"/>
    <text x="1204" y="94">GitHub</text>
  </g>
  <rect x="760" y="118" width="530" height="22" rx="11" fill="#f1e1be"/>
  <text x="778" y="135" font-size="16" font-weight="700" fill="#6f511d" font-family="Inter,Arial,sans-serif">Шапка: язык + быстрые ссылки на людей и ИИ</text>

  <rect x="64" y="190" width="820" height="650" rx="34" fill="url(#space)" filter="url(#shadow)"/>
  <text x="104" y="250" font-size="24" font-weight="800" fill="#ffcf68" font-family="Inter,Arial,sans-serif">ИГРА СРАЗУ НАВЕРХУ</text>
  <text x="104" y="306" font-size="52" font-weight="900" fill="#fff8e8" font-family="Inter,Arial,sans-serif">Глобус вместо</text>
  <text x="104" y="360" font-size="52" font-weight="900" fill="#fff8e8" font-family="Inter,Arial,sans-serif">плоской карты</text>
  <text x="104" y="404" font-size="24" fill="#bfd0e8" font-family="Inter,Arial,sans-serif">Сфера, 6 континентов, автопуск каждые 10 секунд и локальные счётчики.</text>
  <circle cx="360" cy="555" r="190" fill="url(#ocean)" stroke="#c0ebff" stroke-width="5"/>
  <path d="M262 468c58-54 148-64 189-40 30 19 33 44 19 68-14 24-61 33-82 58-25 30-19 83-41 99-39 28-98-18-112-79-13-57-4-76 27-106z" fill="#74b84b" opacity="0.96"/>
  <path d="M406 471c69-46 127-49 157-14 28 32 14 66-11 85-28 22-71 24-96 55-15 20-19 57-51 63-46 9-77-51-58-101 9-24 26-49 59-88z" fill="#7eca55" opacity="0.96"/>
  <path d="M526 632c26-16 54-17 70 4 14 19 12 42-5 56-18 14-53 16-73-5-18-18-12-42 8-55z" fill="#74b84b" opacity="0.96"/>
  <g fill="#f4ba3b" stroke="#ffe8a7" stroke-width="4">
    <circle cx="262" cy="490" r="11"/><circle cx="320" cy="675" r="11"/><circle cx="410" cy="470" r="11"/>
    <circle cx="458" cy="595" r="11"/><circle cx="540" cy="510" r="11"/><circle cx="566" cy="660" r="11"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff8e8">
    <text x="198" y="470">СЕВ. АМЕРИКА</text>
    <text x="240" y="705">ЮЖ. АМЕРИКА</text>
    <text x="435" y="445">ЕВРОПА</text>
    <text x="478" y="626">АФРИКА</text>
    <text x="563" y="486">АЗИЯ</text>
    <text x="564" y="687">ОКЕАНИЯ</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#d6e0f1">
    <rect x="606" y="470" width="230" height="70" rx="20" fill="rgba(255,255,255,0.06)" stroke="#314668"/>
    <text x="632" y="500" font-size="18" font-weight="700">Запущено бутылок</text>
    <text x="632" y="530" font-size="30" font-weight="900" fill="#ffcf68">15 и дальше локально</text>
    <rect x="606" y="560" width="230" height="70" rx="20" fill="rgba(255,255,255,0.06)" stroke="#314668"/>
    <text x="632" y="590" font-size="18" font-weight="700">Режим</text>
    <text x="632" y="620" font-size="28" font-weight="900" fill="#ffcf68">Автопуск 10 сек</text>
  </g>

  <rect x="930" y="190" width="406" height="650" rx="34" fill="#fffdf8" stroke="#d7bf8f" filter="url(#shadow)"/>
  <text x="968" y="246" font-size="22" font-weight="800" fill="#8a5b17" font-family="Inter,Arial,sans-serif">ВСЕ ССЫЛКИ СРАЗУ</text>
  <text x="968" y="300" font-size="40" font-weight="900" fill="#25190b" font-family="Inter,Arial,sans-serif">Один экран —</text>
  <text x="968" y="344" font-size="40" font-weight="900" fill="#25190b" font-family="Inter,Arial,sans-serif">все входы</text>
  <text x="968" y="384" font-size="21" fill="#6e5a3c" font-family="Inter,Arial,sans-serif">Главная собирает прямые ссылки на игру, «Живую партию», инструкции, фидбек и GitHub.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(968 436)">
      <rect width="330" height="58" rx="18" fill="#fff" stroke="#d7bf8f"/>
      <text x="24" y="25" font-size="18" font-weight="900" fill="#25190b">Игра на глобусе</text>
      <text x="24" y="44" font-size="15" fill="#6e5a3c">Сфера, ракеты и счётчики</text>
    </g>
    <g transform="translate(968 506)">
      <rect width="330" height="58" rx="18" fill="#fff" stroke="#d7bf8f"/>
      <text x="24" y="25" font-size="18" font-weight="900" fill="#25190b">Живая партия</text>
      <text x="24" y="44" font-size="15" fill="#6e5a3c">Пошаговый реальный помощник</text>
    </g>
    <g transform="translate(968 576)">
      <rect width="330" height="58" rx="18" fill="#fff" stroke="#d7bf8f"/>
      <text x="24" y="25" font-size="18" font-weight="900" fill="#25190b">Для людей / Для ИИ</text>
      <text x="24" y="44" font-size="15" fill="#6e5a3c">Языковые карточки и state schema</text>
    </g>
    <g transform="translate(968 646)">
      <rect width="330" height="58" rx="18" fill="#fff" stroke="#d7bf8f"/>
      <text x="24" y="25" font-size="18" font-weight="900" fill="#25190b">Фидбек и галерея</text>
      <text x="24" y="44" font-size="15" fill="#6e5a3c">Идеи, баги, фото напитков</text>
    </g>
  </g>
  <rect x="968" y="738" width="330" height="62" rx="22" fill="#b47718"/>
  <text x="1038" y="776" font-size="22" font-weight="900" fill="#fff8eb" font-family="Inter,Arial,sans-serif">Выбор языка в шапке</text>
</svg>