  <circle cx="958" cy="1685" r="5" fill="#221b16"/><circle cx="992" cy="1685" r="5" fill="#221b16"/>
  <rect x="670" y="1910" width="440" height="150" rx="22" fill="#c49af4" class="thin"/>
  <text x="695" y="1960" class="panel-title">Проверить через сутки</text>
  <text x="695" y="2002" class="body">При 28°C: запах, верх, вкус.</text>
  <text x="695" y="2034" class="body">Затем процедить и охладить.</text>

  <path d="M570 1820 H625" class="line" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="2150" width="1080" height="200" rx="30" fill="#ffe7df" stroke="#8d271e" stroke-width="7"/>
  <text x="95" y="2205" class="panel-title" fill="#8d271e">ВАЖНО</text>
  <text x="95" y="2250" class="small">• Основное брожение — под тканью или неплотной крышкой.</text>
  <text x="95" y="2288" class="small">• Прямое солнце не нужно: жидкость может перегреться сильнее воздуха.</text>
  <text x="95" y="2326" class="small">• Плесень, пушок, цветные пятна или гнилостный запах — вылить.</text>
